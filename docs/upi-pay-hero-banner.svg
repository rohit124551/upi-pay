<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#0E1726" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>
    <linearGradient id="saffronGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFA133" />
      <stop offset="50%" stop-color="#F17A21" />
      <stop offset="100%" stop-color="#C24E00" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#088B45" />
      <stop offset="100%" stop-color="#04562B" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Ambient background glow spots -->
  <circle cx="150" cy="120" r="140" fill="#F17A21" opacity="0.12" filter="url(#glow)" />
  <circle cx="1050" cy="300" r="160" fill="#088B45" opacity="0.15" filter="url(#glow)" />

  <!-- Grid decoration lines -->
  <g stroke="#334155" stroke-opacity="0.25" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="200" y1="0" x2="200" y2="420" />
    <line x1="400" y1="0" x2="400" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="800" y1="0" x2="800" y2="420" />
    <line x1="1000" y1="0" x2="1000" y2="420" />
  </g>

  <!-- Left Side: Brand Logo & Typography -->
  <g transform="translate(80, 80)">
    <!-- Logo Icon -->
    <g transform="translate(0, 5) scale(1.5)">
      <path d="M18.8 6.2C19.8 4.2 22.4 3.6 24.2 4.9L39.8 16.5C41.8 18 42.4 20.8 41.2 22.9L22.2 56.4C21.1 58.4 18.5 59 16.7 57.7L8.8 51.8C6.8 50.3 6.3 47.5 7.5 45.4L22.6 18.6C23.1 17.7 22.8 16.6 22 16L18.8 13.6C17 12.3 16.6 9.8 17.8 7.9L18.8 6.2Z" fill="url(#saffronGrad)" />
      <path d="M32.8 6.2C33.8 4.2 36.4 3.6 38.2 4.9L49.8 13.6C51.6 15 52 17.5 50.8 19.5L34.4 48.6C33.2 50.7 30.6 51.3 28.8 50L20.8 44.1C18.8 42.6 18.3 39.8 19.5 37.7L36.6 7.5C36.9 7 36.6 6.4 36 6L32.8 6.2Z" fill="url(#emeraldGrad)" />
    </g>

    <!-- Title -->
    <text x="100" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="900" letter-spacing="-1">
      <tspan fill="url(#saffronGrad)">UPI</tspan>
      <tspan fill="url(#emeraldGrad)" dx="10">Pay</tspan>
      <tspan fill="#64748B" font-size="22" font-weight="500" dx="15" dy="-18">v2.0</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" fill="#F8FAFC">
      Zero-Backend Bulk UPI Payouts &amp; Dynamic QR Suite
    </text>
    <text x="0" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#94A3B8">
      Paste payout lists · Merge duplicates · 4-way total audit · Scan &amp; pay one-by-one safely
    </text>

    <!-- Pill Badges -->
    <g transform="translate(0, 205)">
      <!-- Badge 1: 100% Client-Side -->
      <rect x="0" y="0" width="145" height="30" rx="15" fill="#088B45" fill-opacity="0.18" stroke="#34D399" stroke-opacity="0.4" />
      <circle cx="15" cy="15" r="4" fill="#34D399" />
      <text x="26" y="19" font-family="monospace" font-size="11" font-weight="700" fill="#34D399">100% CLIENT-SIDE</text>

      <!-- Badge 2: Zero Backend -->
      <rect x="155" y="0" width="135" height="30" rx="15" fill="#1E293B" stroke="#475569" stroke-opacity="0.5" />
      <text x="172" y="19" font-family="monospace" font-size="11" font-weight="600" fill="#CBD5E1">ZERO BACKEND</text>

      <!-- Badge 3: NPCI Compliant -->
      <rect x="300" y="0" width="145" height="30" rx="15" fill="#F17A21" fill-opacity="0.15" stroke="#FFA133" stroke-opacity="0.4" />
      <text x="315" y="19" font-family="monospace" font-size="11" font-weight="700" fill="#FFA133">NPCI DEEP LINK</text>

      <!-- Badge 4: Integer Math -->
      <rect x="455" y="0" width="135" height="30" rx="15" fill="#1E293B" stroke="#475569" stroke-opacity="0.5" />
      <text x="472" y="19" font-family="monospace" font-size="11" font-weight="600" fill="#CBD5E1">INTEGER PAISE</text>
    </g>
  </g>

  <!-- Right Side: Mini UI Visual Preview Mockup -->
  <g transform="translate(730, 45)">
    <!-- Browser Window Container -->
    <rect width="410" height="330" rx="14" fill="#0D131F" stroke="#334155" stroke-width="1.5" filter="drop-shadow(0 15px 30px rgba(0,0,0,0.5))" />

    <!-- Window Titlebar -->
    <path d="M 0 14 Q 0 0 14 0 L 396 0 Q 410 0 410 14 L 410 38 L 0 38 Z" fill="#161F30" />
    <circle cx="18" cy="19" r="4.5" fill="#EF4444" />
    <circle cx="33" cy="19" r="4.5" fill="#F59E0B" />
    <circle cx="48" cy="19" r="4.5" fill="#10B981" />
    <text x="70" y="23" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94A3B8" font-weight="600">UPI Pay Terminal · Active Run</text>

    <!-- Progress bar across window -->
    <rect x="0" y="38" width="410" height="4" fill="#1E293B" />
    <rect x="0" y="38" width="310" height="4" fill="url(#emeraldGrad)" />

    <!-- Card Content inside mock -->
    <g transform="translate(20, 55)">
      <!-- Position badge -->
      <text x="0" y="16" font-family="monospace" font-size="11" fill="#94A3B8">Recipient 12 of 15 · <tspan fill="#34D399" font-weight="bold">80% done</tspan></text>

      <!-- Amount -->
      <text x="0" y="55" font-family="monospace" font-size="34" font-weight="bold" fill="#FFFFFF">₹4,250</text>

      <!-- Recipient info -->
      <text x="0" y="80" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="bold" fill="#F1F5F9">Rahul Verma</text>
      <text x="0" y="98" font-family="monospace" font-size="12" fill="#34D399">rahul.verma42@okaxis</text>

      <!-- Mini QR code representation -->
      <g transform="translate(240, 5)">
        <rect width="130" height="130" rx="8" fill="#FFFFFF" />
        <!-- QR pattern squares -->
        <rect x="10" y="10" width="35" height="35" fill="#000" />
        <rect x="15" y="15" width="25" height="25" fill="#FFF" />
        <rect x="20" y="20" width="15" height="15" fill="#000" />

        <rect x="85" y="10" width="35" height="35" fill="#000" />
        <rect x="90" y="15" width="25" height="25" fill="#FFF" />
        <rect x="95" y="20" width="15" height="15" fill="#000" />

        <rect x="10" y="85" width="35" height="35" fill="#000" />
        <rect x="15" y="90" width="25" height="25" fill="#FFF" />
        <rect x="20" y="95" width="15" height="15" fill="#000" />

        <!-- Random data blocks -->
        <rect x="52" y="12" width="8" height="16" fill="#000" />
        <rect x="68" y="18" width="10" height="8" fill="#000" />
        <rect x="52" y="36" width="12" height="12" fill="#000" />
        <rect x="70" y="34" width="8" height="18" fill="#000" />
        <rect x="12" y="52" width="20" height="8" fill="#000" />
        <rect x="36" y="52" width="8" height="16" fill="#000" />
        <rect x="50" y="54" width="28" height="20" fill="#000" />
        <rect x="84" y="54" width="14" height="10" fill="#000" />
        <rect x="104" y="54" width="14" height="14" fill="#000" />
        <rect x="52" y="82" width="18" height="10" fill="#000" />
        <rect x="76" y="82" width="10" height="20" fill="#000" />
        <rect x="92" y="82" width="24" height="10" fill="#000" />
        <rect x="52" y="102" width="12" height="16" fill="#000" />
        <rect x="72" y="108" width="20" height="10" fill="#000" />
        <rect x="100" y="100" width="16" height="18" fill="#000" />
      </g>

      <!-- Mini Buttons Row -->
      <g transform="translate(0, 145)">
        <rect width="130" height="34" rx="6" fill="#10B981" />
        <text x="65" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">✓ I Paid This (Enter)</text>

        <rect x="140" y="0" width="90" height="34" rx="6" fill="#EF4444" fill-opacity="0.15" stroke="#EF4444" stroke-opacity="0.4" />
        <text x="185" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#FCA5A5" text-anchor="middle">Failed (E)</text>

        <rect x="240" y="0" width="70" height="34" rx="6" fill="#1E293B" stroke="#475569" stroke-opacity="0.4" />
        <text x="275" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#CBD5E1" text-anchor="middle">Undo (U)</text>
      </g>

      <!-- Supported App Logos Strip -->
      <g transform="translate(0, 198)">
        <rect width="370" height="52" rx="8" fill="#111827" stroke="#1F2937" />
        <text x="12" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#64748B" font-weight="600" letter-spacing="0.5">COMPATIBLE WITH ALL UPI APPS</text>
        <text x="12" y="38" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="bold" fill="#94A3B8">
          <tspan fill="#38BDF8">GPay</tspan> · <tspan fill="#A855F7">PhonePe</tspan> · <tspan fill="#0EA5E9">Paytm</tspan> · <tspan fill="#F59E0B">BHIM</tspan> · <tspan fill="#10B981">Any Bank App</tspan>
        </text>
      </g>
    </g>
  </g>
</svg>
