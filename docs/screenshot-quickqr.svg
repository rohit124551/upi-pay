<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="qBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#0E1726" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>
    <linearGradient id="saffronQ" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFA133" />
      <stop offset="50%" stop-color="#F17A21" />
      <stop offset="100%" stop-color="#C24E00" />
    </linearGradient>
    <linearGradient id="emeraldQ" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#088B45" />
      <stop offset="100%" stop-color="#04562B" />
    </linearGradient>
  </defs>

  <rect width="960" height="540" fill="url(#qBg)" />

  <!-- Navbar -->
  <rect width="960" height="54" fill="#0D131F" stroke="#1E293B" stroke-width="1" />
  
  <!-- Browser Window Dots -->
  <g transform="translate(24, 21)">
    <circle cx="0" cy="0" r="4.5" fill="#EF4444" />
    <circle cx="15" cy="0" r="4.5" fill="#F59E0B" />
    <circle cx="30" cy="0" r="4.5" fill="#10B981" />
  </g>

  <!-- Brand Logo & Title in Navbar -->
  <g transform="translate(80, 10)">
    <rect x="0" y="0" width="34" height="34" rx="8" fill="#161F30" stroke="#334155" />
    <g transform="translate(4, 3) scale(0.48)">
      <path d="M18.8 6.2C19.8 4.2 22.4 3.6 24.2 4.9L39.8 16.5C41.8 18 42.4 20.8 41.2 22.9L22.2 56.4C21.1 58.4 18.5 59 16.7 57.7L8.8 51.8C6.8 50.3 6.3 47.5 7.5 45.4L22.6 18.6C23.1 17.7 22.8 16.6 22 16L18.8 13.6C17 12.3 16.6 9.8 17.8 7.9L18.8 6.2Z" fill="url(#saffronQ)" />
      <path d="M32.8 6.2C33.8 4.2 36.4 3.6 38.2 4.9L49.8 13.6C51.6 15 52 17.5 50.8 19.5L34.4 48.6C33.2 50.7 30.6 51.3 28.8 50L20.8 44.1C18.8 42.6 18.3 39.8 19.5 37.7L36.6 7.5C36.9 7 36.6 6.4 36 6L32.8 6.2Z" fill="url(#emeraldQ)" />
    </g>
    <text x="44" y="23" font-family="-apple-system, sans-serif" font-size="18" font-weight="900">
      <tspan fill="url(#saffronQ)">UPI</tspan><tspan fill="url(#emeraldQ)" dx="3">Pay</tspan>
      <tspan fill="#64748B" font-size="11" font-weight="500" dx="8">Quick QR</tspan>
    </text>
  </g>

  <!-- Nav Right Links -->
  <g transform="translate(680, 15)">
    <text x="0" y="16" font-family="-apple-system, sans-serif" font-size="11" fill="#64748B">Batch Payouts</text>
    <rect x="90" y="-3" width="85" height="26" rx="6" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-opacity="0.4" />
    <text x="132" y="14" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#34D399" text-anchor="middle">Quick QR</text>
    <text x="210" y="16" font-family="-apple-system, sans-serif" font-size="11" fill="#64748B">FAQ</text>
  </g>

  <!-- Title section -->
  <g transform="translate(40, 75)">
    <text x="0" y="14" font-family="monospace" font-size="11" font-weight="700" fill="#10B981" letter-spacing="1">INSTANT GENERATOR &amp; PAYMENT GATEWAY</text>
    <text x="0" y="44" font-family="-apple-system, sans-serif" font-size="28" font-weight="800" fill="#F8FAFC">Instant One-Off QR &amp; Payment Links</text>
    <text x="0" y="66" font-family="-apple-system, sans-serif" font-size="13" fill="#94A3B8">Generate dynamic NPCI QR codes on the fly. Share clean payment links (/pay/:upiId/:amount) with zero tracking.</text>
  </g>

  <!-- Left: Quick QR Input Panel -->
  <g transform="translate(40, 160)">
    <rect width="490" height="330" rx="12" fill="#0D131F" stroke="#1E293B" stroke-width="1.5" />
    <g transform="translate(24, 24)">
      <!-- UPI ID Field -->
      <text x="0" y="12" font-family="monospace" font-size="11" font-weight="600" fill="#94A3B8">UPI ID *</text>
      <rect x="0" y="20" width="442" height="40" rx="6" fill="#0A0F1A" stroke="#334155" />
      <text x="14" y="45" font-family="monospace" font-size="14" fill="#38BDF8">rahul.verma42@okaxis</text>

      <!-- Grid for Name and Amount -->
      <g transform="translate(0, 75)">
        <!-- Name -->
        <g transform="translate(0, 0)">
          <text x="0" y="12" font-family="monospace" font-size="11" font-weight="600" fill="#94A3B8">RECIPIENT NAME (OPTIONAL)</text>
          <rect x="0" y="20" width="210" height="40" rx="6" fill="#0A0F1A" stroke="#334155" />
          <text x="14" y="45" font-family="-apple-system, sans-serif" font-size="13" fill="#F1F5F9">Rahul Verma</text>
        </g>
        <!-- Amount -->
        <g transform="translate(232, 0)">
          <text x="0" y="12" font-family="monospace" font-size="11" font-weight="600" fill="#94A3B8">AMOUNT IN ₹ (OPTIONAL)</text>
          <rect x="0" y="20" width="210" height="40" rx="6" fill="#0A0F1A" stroke="#334155" />
          <text x="14" y="45" font-family="monospace" font-size="14" font-weight="bold" fill="#34D399">₹1,500</text>
        </g>
      </g>

      <!-- Quick Preset Chips -->
      <g transform="translate(0, 150)">
        <text x="0" y="15" font-family="monospace" font-size="11" fill="#64748B">Quick:</text>
        <rect x="50" y="0" width="55" height="24" rx="4" fill="#1E293B" stroke="#334155" />
        <text x="77" y="16" font-family="monospace" font-size="10" fill="#94A3B8" text-anchor="middle">₹100</text>

        <rect x="115" y="0" width="55" height="24" rx="4" fill="#1E293B" stroke="#334155" />
        <text x="142" y="16" font-family="monospace" font-size="10" fill="#94A3B8" text-anchor="middle">₹200</text>

        <rect x="180" y="0" width="55" height="24" rx="4" fill="#1E293B" stroke="#334155" />
        <text x="207" y="16" font-family="monospace" font-size="10" fill="#94A3B8" text-anchor="middle">₹500</text>

        <rect x="245" y="0" width="65" height="24" rx="4" fill="#065F46" fill-opacity="0.3" stroke="#10B981" />
        <text x="277" y="16" font-family="monospace" font-size="10" font-weight="bold" fill="#34D399" text-anchor="middle">₹1,500</text>

        <rect x="320" y="0" width="60" height="24" rx="4" fill="#1E293B" stroke="#334155" />
        <text x="350" y="16" font-family="monospace" font-size="10" fill="#94A3B8" text-anchor="middle">₹2,000</text>
      </g>

      <!-- Description Note -->
      <g transform="translate(0, 195)">
        <text x="0" y="12" font-family="monospace" font-size="11" font-weight="600" fill="#94A3B8">NOTE / DESCRIPTION</text>
        <rect x="0" y="20" width="442" height="40" rx="6" fill="#0A0F1A" stroke="#334155" />
        <text x="14" y="45" font-family="-apple-system, sans-serif" font-size="13" fill="#CBD5E1">Project milestone payment</text>
      </g>
    </g>
  </g>

  <!-- Right: Generated QR Showcase & Gateway Card -->
  <g transform="translate(560, 160)">
    <rect width="360" height="330" rx="12" fill="#0D131F" stroke="#1E293B" stroke-width="1.5" />
    <g transform="translate(24, 20)">
      <!-- Header inside card -->
      <text x="0" y="14" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#34D399" letter-spacing="0.5">READY TO SCAN &amp; SHARE</text>
      
      <!-- Center QR Code -->
      <g transform="translate(90, 30)">
        <rect width="130" height="130" rx="8" fill="#FFFFFF" filter="drop-shadow(0 4px 10px rgba(0,0,0,0.3))" />
        <rect x="12" y="12" width="34" height="34" fill="#000" />
        <rect x="17" y="17" width="24" height="24" fill="#FFF" />
        <rect x="22" y="22" width="14" height="14" fill="#000" />

        <rect x="84" y="12" width="34" height="34" fill="#000" />
        <rect x="89" y="17" width="24" height="24" fill="#FFF" />
        <rect x="94" y="22" width="14" height="14" fill="#000" />

        <rect x="12" y="84" width="34" height="34" fill="#000" />
        <rect x="17" y="89" width="24" height="24" fill="#FFF" />
        <rect x="22" y="94" width="14" height="14" fill="#000" />

        <!-- Mock data bits -->
        <rect x="52" y="15" width="8" height="20" fill="#000" />
        <rect x="68" y="22" width="10" height="8" fill="#000" />
        <rect x="52" y="45" width="24" height="18" fill="#000" />
        <rect x="85" y="55" width="30" height="12" fill="#000" />
        <rect x="15" y="55" width="25" height="12" fill="#000" />
        <rect x="52" y="85" width="16" height="25" fill="#000" />
        <rect x="75" y="95" width="25" height="12" fill="#000" />
        <rect x="105" y="85" width="12" height="25" fill="#000" />
      </g>

      <!-- Amount & VPA underneath QR -->
      <text x="155" y="185" font-family="monospace" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">₹1,500.00</text>
      <text x="155" y="202" font-family="monospace" font-size="11" fill="#94A3B8" text-anchor="middle">rahul.verma42@okaxis</text>

      <!-- Action Buttons Row -->
      <g transform="translate(0, 225)">
        <rect width="90" height="32" rx="6" fill="#0284C7" fill-opacity="0.2" stroke="#38BDF8" stroke-opacity="0.4" />
        <text x="45" y="20" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#38BDF8" text-anchor="middle">↗ Open Link</text>

        <rect x="100" width="90" height="32" rx="6" fill="#10B981" />
        <text x="145" y="20" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" fill="#000" text-anchor="middle">📋 Copy Link</text>

        <rect x="200" width="112" height="32" rx="6" fill="#1E293B" stroke="#334155" />
        <text x="256" y="20" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#E2E8F0" text-anchor="middle">🖼️ Standee Card</text>
      </g>
    </g>
  </g>
</svg>